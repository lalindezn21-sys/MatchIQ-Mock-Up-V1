<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchIQ</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .nav {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 30px;
    }

    .nfl-logo {
      display: block;
      width: auto;
      height: 30px;
      object-fit: contain;
    }

    .logo {
      display: block;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }

    .menu {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px auto 0;
      overflow: hidden;
      height: 0;
    }

    .menu-item {
      position: relative;
      display: block;
      padding: 0 14px;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.25px;
      line-height: 1;
      opacity: 0;
      transform: translateY(-8px);
    }

    .menu-item + .menu-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 1px;
      height: 12px;
      background: rgba(70, 70, 70, 0.4);
      transform: translateY(-50%);
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="brand">
      <img class="nfl-logo" src="NFL.svg" alt="NFL">
      <h1 class="logo">matchIQ</h1>
    </div>

    <div class="menu">
      <a class="menu-item" href="#">SIGN IN</a>
      <a class="menu-item" href="#">ANALYTICS</a>
      <a class="menu-item" href="#">HEDGE</a>
    </div>
  </nav>

  <script>
    const nav = document.querySelector('.nav');
    const menu = document.querySelector('.menu');
    const items = document.querySelectorAll('.menu-item');

    const openMenu = () => {
      gsap.killTweensOf([menu, ...items]);
      gsap.to(menu, {
        height: 28,
        duration: 0.45,
        ease: "power3.out"
      });
      gsap.to(items, {
        opacity: 1,
        y: 0,
        duration: 0.35,
        stagger: 0.08,
        delay: 0.08,
        ease: "power2.out"
      });
    };

    const closeMenu = () => {
      gsap.killTweensOf([menu, ...items]);
      gsap.to(items, {
        opacity: 0,
        y: -8,
        duration: 0.2,
        stagger: 0.04,
        ease: "power2.in"
      });
      gsap.to(menu, {
        height: 0,
        duration: 0.35,
        delay: 0.08,
        ease: "power3.inOut"
      });
    };

    nav.addEventListener('mouseenter', openMenu);
    nav.addEventListener('mouseleave', closeMenu);
  </script>
</body>
</html>
